name: Ollama with an approved model
description: Installs Ollama and downloads one approved model (ADR-0045, ADR-0051).
inputs:
  model:
    description: The model to download
    default: qwen3:14b
runs:
  using: composite
  steps:
    - shell: bash
      env:
        MODEL: ${{ inputs.model }}
      run: |
        echo "PAKKIFILE_EXTRACTION_MODEL=qwen3:14b" >> "$GITHUB_ENV"
        echo "PAKKIFILE_EXTRACTION_THINK=off" >> "$GITHUB_ENV"
        # Ollama's download site has failed a whole run before, so retry the install.
        for attempt in 1 2 3 4 5; do
          curl -fsSL https://ollama.com/install.sh | sh && break
          [ "$attempt" = 5 ] && exit 1
          sleep $((attempt * 60))
        done
        curl -sf http://127.0.0.1:11434/api/tags >/dev/null || (nohup ollama serve >/tmp/ollama.log 2>&1 &)
        timeout 60 bash -c 'until curl -sf http://127.0.0.1:11434/api/tags >/dev/null; do sleep 1; done'
        ollama pull "$MODEL"
