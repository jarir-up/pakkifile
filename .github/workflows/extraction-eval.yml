name: extraction-eval

# Scores the real model when something that shapes its output changes.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/pakkifile/llm/**
      - evaldata/labels/extraction/**
      - eval/extraction.py
      - .github/actions/ollama/**

permissions:
  contents: read

defaults:
  run:
    shell: bash # Adds pipefail, so a failed gate fails the step.

jobs:
  extraction:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: uv sync --frozen
      - uses: ./.github/actions/ollama
      - run: uv run --frozen python -m eval.extraction | tee -a "$GITHUB_STEP_SUMMARY"
