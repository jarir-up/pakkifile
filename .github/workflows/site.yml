name: site

# The checklist site on GitHub Pages (ADR-0030). Registry job commits use the
# built-in token, which triggers no push event, so the site also rebuilds
# after every registry run.
on:
  push:
    branches: [main]
    paths:
      - "registry-data/**"
      - "src/pakkifile/registry/**"
      - "src/pakkifile/web/**"
      - ".github/workflows/site.yml"
      - "pyproject.toml"
      - "uv.lock"
  workflow_run:
    workflows: [registry]
    types: [completed]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # After a registry run, build what it committed.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || '' }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          python-version: "3.12"
      # Runtime dependencies only, as the deployed build has.
      - run: uv run --frozen --no-dev python -m pakkifile.web.site --out build/site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    # Pull requests build only; main deploys.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
